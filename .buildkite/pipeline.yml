env:
  BUILDKITE_SKIP_CHECKOUT: "true"

steps:
  - label: ":python: Iterator regression tests"
    agents:
      queue: pb-elastic
    concurrency: 1
    concurrency_group: pbuckley/more-itertools-demo
    command: |
      set -euo pipefail
      cd /var/lib/buildkite-agent/repos/more-itertools
      git diff --quiet HEAD || { echo "Pre-staged clone has tracked changes; refusing to overwrite them."; exit 1; }
      ref="$BUILDKITE_COMMIT"
      if [ "$ref" = HEAD ]; then ref="$BUILDKITE_BRANCH"; fi
      git fetch --no-tags origin "$ref"
      git checkout --detach FETCH_HEAD
      docker run --rm --volume "$(pwd):/work" --workdir /work \
        python:3.12-slim \
        python3 -m unittest --failfast --verbose \
        tests.test_more.ChunkedTests \
        tests.test_more.FirstTests \
        tests.test_more.LastTests
    timeout_in_minutes: 2
