steps:
  - &job
    label: ":git: Prepare source & tools"
    key: prepare
    agents:
      queue: pb-elastic
    plugins:
      - thedyrt/skip-checkout#v0.1.1: {}
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      cache=/var/lib/buildkite-agent/repos/more-itertools
      work=$(mktemp -d)
      trap 'rm -rf "$$work"' EXIT
      ref="$$BUILDKITE_COMMIT"
      if [ "$$ref" = HEAD ]; then ref="$$BUILDKITE_BRANCH"; fi
      if [ "$$BUILDKITE_STEP_KEY" != prepare ]; then
        ref=$(buildkite-agent meta-data get source-commit --default "$$ref")
      fi
      (
        flock 9
        git -C "$$cache" fetch --no-tags origin "$$ref"
        git -C "$$cache" archive FETCH_HEAD | tar -x -C "$$work"
        if [ "$$BUILDKITE_STEP_KEY" = prepare ]; then
          buildkite-agent meta-data set source-commit "$(git -C "$$cache" rev-parse FETCH_HEAD)"
        fi
      ) 9>"$$cache/.git/demo-snapshot.lock"
      cd "$$work"
      bash .buildkite/ci.sh "$$BUILDKITE_STEP_KEY"

  - group: ":mag: Quality & security"
    key: quality
    depends_on: prepare
    steps:
      - <<: *job
        label: ":ruff: Lint"
        key: lint
      - <<: *job
        label: ":straight_ruler: Formatting"
        key: format
      - <<: *job
        label: ":label: Type-stub contracts"
        key: types
      - <<: *job
        label: ":lock: Source secret scan"
        key: secrets

  - group: ":test_tube: Tests & coverage"
    key: tests
    depends_on: quality
    steps:
      - <<: *job
        label: ":python: Iterator API tests"
        key: iterators
      - <<: *job
        label: ":python: Recipe API tests"
        key: recipes

  - group: ":package: Build distributions"
    key: packages
    depends_on: tests
    steps:
      - <<: *job
        label: ":wheel: Build wheel"
        key: wheel
      - <<: *job
        label: ":package: Build source distribution"
        key: sdist

  - group: ":white_check_mark: Release verification"
    key: verification
    depends_on: packages
    steps:
      - <<: *job
        label: ":microscope: Installed-wheel smoke test"
        key: install
      - <<: *job
        label: ":page_facing_up: Metadata & checksums"
        key: metadata

  - <<: *job
    label: ":memo: Publish build report"
    key: report
    depends_on: [prepare, quality, tests, packages, verification]
    allow_dependency_failure: true
