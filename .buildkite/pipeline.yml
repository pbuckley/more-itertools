steps:
  - &iterator-tests
    label: ":package: Chunking"
    key: chunking
    env:
      TEST_CLASS: tests.test_more.ChunkedTests
    agents:
      queue: pb-elastic
    plugins:
      - thedyrt/skip-checkout#v0.1.1:
          cd: /var/lib/buildkite-agent/repos/more-itertools
    concurrency: 1
    concurrency_group: pbuckley/more-itertools-demo
    command: |
      set -euo pipefail
      git diff --quiet HEAD || { echo "Pre-staged clone has tracked changes; refusing to overwrite them."; exit 1; }
      ref="$$BUILDKITE_COMMIT"
      if [ "$$ref" = HEAD ]; then ref="$$BUILDKITE_BRANCH"; fi
      git fetch --no-tags origin "$$ref"
      git checkout --detach FETCH_HEAD
      python3.12 -m unittest --failfast --verbose "$$TEST_CLASS"
    timeout_in_minutes: 2

  - <<: *iterator-tests
    label: ":arrow_forward: First item"
    key: first-item
    depends_on: chunking
    env:
      TEST_CLASS: tests.test_more.FirstTests

  - <<: *iterator-tests
    label: ":fast_forward: Last item"
    key: last-item
    depends_on: first-item
    env:
      TEST_CLASS: tests.test_more.LastTests
